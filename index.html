<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şarkı Sözü Bulucu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(to right, #6a11cb, #2575fc);
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-color: #fff;
      --input-bg: rgba(255, 255, 255, 0.2);
      --placeholder-color: #ddd;
      --button-bg: #00c6ff;
      --button-hover: #0072ff;
      --youtube-bg: #FF0000;
      --youtube-hover: #cc0000;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      transition: all 0.5s ease;
      position: relative;
    }
    .switch {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 60px;
      height: 30px;
      background: #ccc;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 5px;
      transition: background 0.3s;
    }
    .switch-circle {
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .switch.active {
      background: #4caf50;
    }
    .switch.active .switch-circle {
      transform: translateX(30px);
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2.5em;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      transition: background 0.5s ease;
    }
    input, button, textarea {
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
    }
    input, textarea {
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
      transition: background 0.5s ease, color 0.5s ease;
    }
    textarea {
      height: 200px;
      resize: none;
    }
    button {
      background-color: var(--button-bg);
      cursor: pointer;
      transition: background 0.3s ease;
      font-weight: bold;
    }
    button:hover {
      background-color: var(--button-hover);
    }
    input::placeholder,
    textarea::placeholder {
      color: var(--placeholder-color);
    }
    #youtube-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--youtube-bg);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 1em;
      transition: transform 0.3s, background-color 0.3s;
    }
    #youtube-button:hover {
      background-color: var(--youtube-hover);
      transform: scale(1.05);
    }
    #youtube-icon {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>

  <div class="switch" id="theme-switch" onclick="toggleTheme()">
    <div class="switch-circle"></div>
  </div>

  <h1>🎵 Şarkı Sözü Bulucu</h1>

  <div class="card">
    <input type="text" id="artist" placeholder="Sanatçı Adı (örnek: Tarkan)">
    <input type="text" id="title" placeholder="Şarkı Adı (örnek: Şımarık)">
    <button onclick="getLyrics()">Şarkı Sözünü Getir</button>
    <textarea id="lyrics" placeholder="Şarkı sözleri burada görünecek..." readonly></textarea>
    <a id="youtube-button" href="#" target="_blank" style="display:none;">
      <img id="youtube-icon" src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
      YouTube'da Dinle
    </a>
  </div>

  <script>
    let isDark = true;

    function toggleTheme() {
  const switchBtn = document.getElementById('theme-switch');
  switchBtn.classList.toggle('active');

  if (!isDark) {
    // DARK MODE
    document.documentElement.style.setProperty('--bg-gradient', '#121212');
    document.documentElement.style.setProperty('--card-bg', '#1e1e1e');
    document.documentElement.style.setProperty('--text-color', '#ffffff');
    document.documentElement.style.setProperty('--input-bg', '#2c2c2c');
    document.documentElement.style.setProperty('--placeholder-color', '#aaaaaa');
    document.documentElement.style.setProperty('--button-bg', '#00c6ff');
    document.documentElement.style.setProperty('--button-hover', '#0072ff');
  } else {
    // LIGHT MODE
    document.documentElement.style.setProperty('--bg-gradient', '#f0f2f5'); 
document.documentElement.style.setProperty('--card-bg', '#ffffff'); 
document.documentElement.style.setProperty('--text-color', '#111111'); 
document.documentElement.style.setProperty('--input-bg', '#ffffff'); 
document.documentElement.style.setProperty('--placeholder-color', '#666666'); 
document.documentElement.style.setProperty('--button-bg', '#666666'); 
document.documentElement.style.setProperty('--button-hover', '#888888'); 

  }
  isDark = !isDark;
}


    function getLyrics() {
      const artist = document.getElementById('artist').value;
      const title = document.getElementById('title').value;
      const youtubeButton = document.getElementById('youtube-button');

      if (!artist || !title) {
        alert("Lütfen sanatçı ve şarkı adını giriniz!");
        return;
      }

      const url = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.lyrics) {
            document.getElementById('lyrics').value = data.lyrics;
            const youtubeSearchQuery = encodeURIComponent(artist + " " + title);
            youtubeButton.href = `https://www.youtube.com/results?search_query=${youtubeSearchQuery}`;
            youtubeButton.style.display = "inline-flex";
          } else {
            document.getElementById('lyrics').value = "Şarkı sözü bulunamadı.";
          }
        })
        .catch(error => {
          console.error(error);
          document.getElementById('lyrics').value = "Bir hata oluştu.";
          youtubeButton.style.display = "none";
        });
    }
  </script>

</body>
</html>
